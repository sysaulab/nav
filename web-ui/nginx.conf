server {
    listen 80;
    server_name _;

    # SPA: let React Router handle unknown paths.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to maestro. `maestro` resolves via Docker's internal DNS.
    location /api/ {
        proxy_pass http://maestro:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # NDJSON streaming (chat / finalize) — must disable buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}