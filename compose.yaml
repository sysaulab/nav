name: navigator

services:
  # ── Application state ────────────────────────────────────
  # Sessions, document payloads, and the HSDS-shaped
  # directory. Postgres (instead of SQLite) is what lets
  # `nav` scale horizontally later without sharing a file.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: navigator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only — the DB must never be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ── Document Sanitizer ───────────────────────────────────
  sanitizer:
    build:
      context: ./sanitizer
      dockerfile: dockerfile          # lowercase filename in the repo
    image: navigator/sanitizer:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sanitizer-model-cache:/opt/models
    environment:
      SANITIZER_LOG_LEVEL: INFO
      SANITIZER_MAX_UPLOAD_BYTES: "104857600"
      SANITIZER_MAX_PAGES: "500"
      SANITIZER_LOW_CONFIDENCE_THRESHOLD: "0.65"
    restart: unless-stopped

  # ── Navigator (interview orchestration) ──────────────────
  nav:
    build:
      context: ./nav
      dockerfile: dockerfile
    image: navigator/nav-server:local
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NAVIGATOR_DATABASE_URL: "postgresql+asyncpg://navigator:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/navigator"
      NAVIGATOR_SANITIZER_ENDPOINT: "http://sanitizer:8000/ingest"
      NAVIGATOR_PHOTON_ENDPOINT: "http://photon:2322"

      # Nominatim is not part of the pilot stack. All geocoding goes
      # through Photon. Uncomment + restore the `nominatim-bc` service
      # when the `/lookup` canonical-resolution step lands.
      # NAVIGATOR_NOMINATIM_ENDPOINT: "http://nominatim-bc:8080"

      # ── External Ollama ──────────────────────────────────
      # Point this at the host machine (or wherever your Ollama is
      # listening). On Docker Desktop (macOS/Windows) the host is
      # host.docker.internal; on Linux it's the bridge gateway
      # (commonly 172.17.0.1).
      NAVIGATOR_OLLAMA_ENDPOINT: "http://host.docker.internal:11434"

      # ── Model registry seeds (env tier) ──────────────────
      # Layered under the database; DB wins per-id. Editing models
      # via /admin (nav-admin on :8008) writes DB overrides and takes
      # effect immediately. These seeds are what a fresh deploy sees
      # on first boot before any admin action.
      #
      # Endpoints point at host.docker.internal — the hardcoded dev
      # defaults in ai/registry.py use 127.0.0.1, which inside the
      # container is the container itself.
      NAVIGATOR_MODELS_JSON: >-
        [
          {"id":"ollama-gemma4-cloud","module":"ollama","endpoint":"http://host.docker.internal:11434","model":"gemma4:cloud","context_window":256000,"max_output_tokens":8192,"label":"Gemma 4 (Ollama Cloud)"},
          {"id":"ollama-local","module":"ollama","endpoint":"http://host.docker.internal:11434","model":"gemma2:2b","context_window":8192,"max_output_tokens":2048,"label":"Ollama local (gemma2:2b)"}
        ]
      NAVIGATOR_DEFAULT_CHAT_MODEL_ID: "ollama-gemma4-cloud"
      NAVIGATOR_DEFAULT_FINALIZE_MODEL_ID: "ollama-gemma4-cloud"

      # Deprecated: chat and finalize route through the model registry
      # now (see nav/navigator/ai/registry.py). Kept commented for
      # operators upgrading from an older compose file.
      # NAVIGATOR_OLLAMA_MODEL: "gemma4:cloud"
      # NAVIGATOR_FINAL_MODEL: "nemotron-3-ultra:cloud"

      # ── Admin ────────────────────────────────────────────
      # Bearer token for /admin-api/*. Required for nav-admin
      # (running on :8008) to work. Rotate by changing this and
      # restarting the nav container.
      NAVIGATOR_ADMIN_TOKEN: "${NAVIGATOR_ADMIN_TOKEN:-dev-admin-token-change-me}"

    depends_on:
      postgres:
        condition: service_healthy
      sanitizer:
        condition: service_started
      photon:
        condition: service_started
    restart: unless-stopped

  # ── Photon (fuzzy geocoder) ──────────────────────────────
  # Community image (not official Komoot). Downloads a prebuilt
  # regional index on first boot — allow time and disk.
  # API: GET http://photon:2322/api?q=Oppen&limit=5
  # Response includes osm_type / osm_id + structured fields,
  # which is what the eventual Nominatim /lookup step will consume.
  photon:
    image: rtuszik/photon-docker:latest
    ports:
      - "127.0.0.1:2322:2322"
    environment:
      # Prebuilt region: country code, continent, or "planet".
      # "canada" is far smaller than the ~60GB planet index.
      # If "canada" isn't offered in the current release, use
      # "north-america".
      REGION: "canada"
      # Don't auto-refresh the index behind our back; we control
      # when the index is rebuilt.
      UPDATE_STRATEGY: "DISABLED"
    volumes:
      - photon-data:/photon/data
    restart: unless-stopped

  nav-ui:
    build: ./nav-ui
    ports: ["80:80"]
    depends_on: [nav]

  # ── Admin UI ─────────────────────────────────────────────
  # Protected by NAVIGATOR_ADMIN_TOKEN (bearer). Reachable on :8008
  # only through this container's nginx — public nav-ui's nginx does
  # not proxy /admin-api/*, so this frontend is the only path in.
  nav-admin:
    build: ./nav-admin
    ports: ["8008:80"]
    depends_on: [nav]
    restart: unless-stopped

volumes:
  pgdata:
  photon-data:
  sanitizer-model-cache: