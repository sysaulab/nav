name: navigator

services:
  # ── Document Sanitizer ───────────────────────────────────
  sanitizer:
    build:
      context: ./sanitizer
      dockerfile: dockerfile          # lowercase filename in the repo
    image: navigator/sanitizer:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SANITIZER_LOG_LEVEL: INFO
      SANITIZER_MAX_UPLOAD_BYTES: "104857600"
      SANITIZER_MAX_PAGES: "500"
      SANITIZER_LOW_CONFIDENCE_THRESHOLD: "0.65"
    restart: unless-stopped

  # ── Navigator (interview orchestration) ──────────────────
  nav:
    build:
      context: ./nav
      dockerfile: dockerfile
    image: navigator/nav-server:local
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - navigator-data:/data
    environment:
      NAVIGATOR_DATABASE_URL: "sqlite+aiosqlite:////data/navigator.db"
      NAVIGATOR_SANITIZER_ENDPOINT: "http://sanitizer:8000/ingest"
      NAVIGATOR_NOMINATIM_ENDPOINT: "http://nominatim-bc:8080"
      NAVIGATOR_PHOTON_ENDPOINT: "http://photon:2322"

      # ── External Ollama ──────────────────────────────────
      # Point this at the host machine (or wherever your Ollama is
      # listening). On Docker Desktop (macOS/Windows) the host is
      # host.docker.internal; on Linux it's the bridge gateway
      # (commonly 172.17.0.1).
      NAVIGATOR_OLLAMA_ENDPOINT: "http://host.docker.internal:11434"

      # gemma4:cloud and beam:cloud are Ollama Cloud tags. If your
      # external Ollama is signed in to Ollama Cloud, these just work.
      NAVIGATOR_OLLAMA_MODEL: "gemma4:cloud"
      NAVIGATOR_FINAL_MODEL: "nemotron-3-ultra:cloud"

    depends_on:
      sanitizer:
        condition: service_started
      nominatim-bc:
        condition: service_started
      photon:
        condition: service_started
    restart: unless-stopped

  # ── Nominatim (geocoder) ─────────────────────────────────
  nominatim-bc:
    image: mediagis/nominatim:4.4
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PBF_URL: "https://download.geofabrik.de/north-america/canada/british-columbia-latest.osm.pbf"
      REPLICATION_URL: "https://download.geofabrik.de/north-america/canada/british-columbia-updates/"
      NOMINATIM_PASSWORD: "change-me"
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
      - nominatim-pbf:/nominatim-pbf
    shm_size: 1gb
    restart: unless-stopped

  # ── Photon (fuzzy typeahead) ─────────────────────────────
  # Community image (not official Komoot). Downloads a prebuilt
  # regional index on first boot — allow time and disk.
  # API: GET http://photon:2322/api?q=Oppen&limit=5
  # Response includes osm_type / osm_id + structured fields,
  # which is exactly what Nominatim /lookup needs.
  photon:
    image: rtuszik/photon-docker:latest
    ports:
      - "127.0.0.1:2322:2322"
    environment:
      # Prebuilt region: country code, continent, or "planet".
      # "canada" is far smaller than the ~60GB planet index.
      # If "canada" isn't offered in the current release, use
      # "north-america".
      REGION: "canada"
      # Don't auto-refresh the index behind our back; we control
      # when the index is rebuilt.
      UPDATE_STRATEGY: "DISABLED"
    volumes:
      - photon-data:/photon/data
    restart: unless-stopped

  nav-ui:
    build: ./nav-ui
    ports: ["80:80"]
    depends_on: [nav]

volumes:
  navigator-data:
  nominatim-data:
  nominatim-pbf:
  photon-data: